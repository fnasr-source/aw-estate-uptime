# Estate uptime monitor. Canonical source: scripts/estate-uptime/ in the Internal
# OS repo. Published by COPYING to .github/workflows/estate-uptime.yml in the
# public repo; never edit the public copy. See README.md.
#
# Alerts go through the Admireworks alert router (quiet inbox, business brain
# plan Part 2): each state change is POSTed to the portal's router endpoint
# (secrets OPS_FEED_URL, optional, default https://my.admireworks.com/api/ops-feed/signal,
# and OPS_FEED_INGEST_SECRET). The router turns "down" into ONE [ACT] email plus
# push (with one reminder after 24 h if still down), and "recovered" and "silent"
# (severity high) into morning-page lines, no email. "Down" already means down
# twice in a row: check.sh retries every failing host once after 60 s.
# Fallback: when the router cannot be reached (the portal itself may be the host
# that is down), the down job sends the old direct email through Resend (secrets
# RESEND_ALERT_KEY and ALERT_TO) and fails, so the run is red. Only a site that is
# down ever emails: a recovery and a silent monitor never email and never fail the
# run (a failed run makes GitHub email the account owner).
#   - job "ALERT estate host down"     on a change from up to down;
#   - job "NOTICE estate recovered"    on a change from down to up (morning line only);
#   - job "NOTICE monitor was silent"  when the previous scheduled run is more than
#     6 hours old (morning line only; GitHub throttles schedules on quiet repos);
#     router unreachable or secret unset: a ::warning:: in the log, nothing else;
#   - a manual run (workflow_dispatch) reports whenever its check fails, so a test
#     with a .invalid extra_url proves the path end to end.
# The current state is recorded by job "state hosts down", which SUCCEEDS on every
# run while a host is down and is skipped otherwise; the next run reads it from the
# previous scheduled run to tell a new outage from a continuing one. The email
# names only the failed job, never a host.
name: estate-uptime

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '17 3 1 * *'
  workflow_dispatch:
    inputs:
      extra_url:
        description: 'Optional extra URL to check on top of the host list (visible in the run summary; never put a client host here)'
        required: false
        default: ''
        type: string

# Least privilege. The heartbeat job raises contents to write for itself only.
permissions:
  contents: read
  actions: read

concurrency:
  group: estate-uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      cur: ${{ steps.decide.outputs.cur }}
      transition: ${{ steps.decide.outputs.transition }}
      silent: ${{ steps.decide.outputs.silent }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Public run logs are readable by anyone. The host list comes from a
      # SECRET (a variable would be printed unmasked in the step header before
      # any mask could apply), and every host name is also registered with
      # ::add-mask:: so it shows as *** in all later output of this job.
      - name: Mask host names
        env:
          ESTATE_HOSTS: ${{ secrets.ESTATE_HOSTS }}
          EXTRA_URL: ${{ inputs.extra_url }}
        run: |
          if [ -n "${ESTATE_HOSTS:-}" ]; then
            for h in $(bash check.sh --hosts-line); do
              echo "::add-mask::$h"
            done
          fi
          if [ -n "${EXTRA_URL:-}" ]; then
            echo "::add-mask::$EXTRA_URL"
            xh=${EXTRA_URL#*://}
            xh=${xh%%/*}
            [ -z "$xh" ] || echo "::add-mask::$xh"
          fi

      # Never fails the step itself: the verdict is carried in the rc output.
      - name: Check hosts
        id: check
        env:
          ESTATE_HOSTS: ${{ secrets.ESTATE_HOSTS }}
          EXTRA_URL: ${{ inputs.extra_url }}
        run: |
          set +e
          if [ -n "${EXTRA_URL:-}" ]; then
            bash check.sh "$EXTRA_URL" > check.out
          else
            bash check.sh > check.out
          fi
          rc=$?
          cat check.out
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      # Reads the previous completed scheduled run: its age (silent monitor) and
      # whether its "state hosts down" job succeeded (it was down). If history
      # cannot be read, a failing check is treated as a new outage, so the
      # monitor errs toward an email rather than toward silence.
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RC: ${{ steps.check.outputs.rc }}
          EVENT: ${{ github.event_name }}
        run: |
          rc="${CHECK_RC:-}"
          [ -n "$rc" ] || rc=2
          if [ "$rc" = 0 ]; then cur=ok; else cur=fail; fi
          transition=none; silent=no
          if [ "$EVENT" = schedule ]; then
            prev=$(gh run list -R "$GITHUB_REPOSITORY" --workflow estate-uptime.yml \
                     --event schedule --status completed --limit 10 \
                     --json databaseId,createdAt \
                     --jq '[.[] | select(.databaseId != '"$GITHUB_RUN_ID"')][0] | if . == null then "none 0" else "\(.databaseId) \(.createdAt | fromdateiso8601)" end' \
                     2>/dev/null) || prev=""
            if [ -z "$prev" ]; then
              echo "history unreadable"
              [ "$cur" = fail ] && transition=down
            elif [ "${prev%% *}" = none ]; then
              echo "first scheduled run"
              [ "$cur" = fail ] && transition=down
            else
              prev_id=${prev%% *}; prev_epoch=${prev##* }
              gap=$(( $(date +%s) - prev_epoch ))
              [ "$gap" -gt 21600 ] && silent=yes
              was=$(gh run view "$prev_id" -R "$GITHUB_REPOSITORY" --json jobs \
                      --jq '[.jobs[] | select(.name == "state hosts down" and .conclusion == "success")] | length' \
                      2>/dev/null) || was=""
              if [ -z "$was" ]; then
                echo "previous state unreadable"
                [ "$cur" = fail ] && transition=down
              else
                if [ "$was" -gt 0 ]; then prevs=fail; else prevs=ok; fi
                if [ "$cur" = fail ] && [ "$prevs" = ok ]; then transition=down; fi
                if [ "$cur" = ok ] && [ "$prevs" = fail ]; then transition=recovered; fi
                echo "previous run $prev_id: $prevs; now: $cur; gap ${gap}s"
              fi
            fi
          else
            [ "$cur" = fail ] && transition=manual_fail
          fi
          echo "cur=$cur transition=$transition silent=$silent"
          { echo "cur=$cur"; echo "transition=$transition"; echo "silent=$silent"; } >> "$GITHUB_OUTPUT"
          {
            echo "### Estate check"
            echo "state: $cur, transition: $transition, silent monitor: $silent"
            echo "failing entries: $(grep -c '^FAIL ' check.out || true) (names are not written here: summaries are public)"
          } >> "$GITHUB_STEP_SUMMARY"

  state-down:
    name: state hosts down
    needs: check
    if: needs.check.outputs.cur == 'fail'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "one or more hosts are down (recorded for the next run)"

  alert-down:
    name: ALERT estate host down
    needs: check
    if: needs.check.outputs.transition == 'down' || needs.check.outputs.transition == 'manual_fail'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Tell the alert router
        id: router
        env:
          OPS_FEED_URL: ${{ secrets.OPS_FEED_URL }}
          OPS_FEED_INGEST_SECRET: ${{ secrets.OPS_FEED_INGEST_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          url="${OPS_FEED_URL:-https://my.admireworks.com/api/ops-feed/signal}"
          if [ -z "${OPS_FEED_INGEST_SECRET:-}" ]; then
            echo "::warning::OPS_FEED_INGEST_SECRET is not set; using the fallback"
            echo "routed=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A manual test run reports on its own entity, so it never leaves the
          # real estate row marked down (no scheduled run would clear it).
          # The state is unique per transition (down_<UTC minute>): a new outage
          # after a recovery whose POST was lost is still a new state, so it alerts.
          ent=estate; [ "$EVENT" = workflow_dispatch ] && ent=manual-test
          body=$(jq -n --arg run "$RUN_URL" --arg ent "$ent" --arg st "down_$(date -u +%Y%m%d%H%M)" \
            '{source: "estate-uptime", entityId: $ent, state: $st, severity: (if $ent == "estate" then "critical" else "high" end), title: "An estate site is down", body: "One or more estate hosts stopped answering 200 twice in a row. Host names are not sent; run bash scripts/estate-uptime/check.sh in Internal OS to see which.", link: $run}')
          if curl -fsS --max-time 20 -X POST "$url" \
               -H "Authorization: Bearer $OPS_FEED_INGEST_SECRET" -H "Content-Type: application/json" \
               -d "$body" > /dev/null; then
            echo "routed"; echo "routed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::router unreachable"; echo "routed=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Fallback email (router unreachable)
        if: steps.router.outputs.routed != 'yes'
        env:
          RESEND_ALERT_KEY: ${{ secrets.RESEND_ALERT_KEY }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "${RESEND_ALERT_KEY:-}" ] && [ -n "${ALERT_TO:-}" ]; then
            body=$(jq -n --arg to "$ALERT_TO" --arg subject "[ACT] AW estate: a host is down" \
              --arg text "One or more estate hosts stopped answering 200, and the alert router could not be reached. Run bash scripts/estate-uptime/check.sh in Internal OS to see which. Run: $RUN_URL" \
              '{from: "Admireworks <hello@admireworks.com>", to: [$to], subject: $subject, text: $text}')
            curl -fsS --max-time 20 -X POST https://api.resend.com/emails \
              -H "Authorization: Bearer $RESEND_ALERT_KEY" -H "Content-Type: application/json" \
              -d "$body" > /dev/null && echo "fallback email sent" || echo "::error::fallback email failed"
          else
            echo "::error::RESEND_ALERT_KEY or ALERT_TO is not set; no fallback email"
          fi
          echo "::error::One or more estate hosts stopped answering 200, and the alert router could not be reached. Run bash scripts/estate-uptime/check.sh in Internal OS to see which."
          exit 1

  alert-recovered:
    name: NOTICE estate recovered
    needs: check
    if: needs.check.outputs.transition == 'recovered'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Tell the alert router
        id: router
        env:
          OPS_FEED_URL: ${{ secrets.OPS_FEED_URL }}
          OPS_FEED_INGEST_SECRET: ${{ secrets.OPS_FEED_INGEST_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          url="${OPS_FEED_URL:-https://my.admireworks.com/api/ops-feed/signal}"
          if [ -z "${OPS_FEED_INGEST_SECRET:-}" ]; then
            echo "::warning::OPS_FEED_INGEST_SECRET is not set; using the fallback"
            echo "routed=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          body=$(jq -n --arg run "$RUN_URL" \
            '{source: "estate-uptime", entityId: "estate", state: "up", severity: "info", title: "All estate sites answer again", body: "All estate hosts answer 200 again.", link: $run, resolved: true}')
          # One retry: a lost recovery would leave the row open and earn a
          # needless 24 h reminder.
          post() { curl -fsS --max-time 20 -X POST "$url" \
               -H "Authorization: Bearer $OPS_FEED_INGEST_SECRET" -H "Content-Type: application/json" \
               -d "$body" > /dev/null; }
          if post || { sleep 30; post; }; then
            echo "routed"; echo "routed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::router unreachable"; echo "routed=no" >> "$GITHUB_OUTPUT"
          fi

  # Morning line only, never an email (owner, 21 Oct 2026): no fallback email,
  # and the job never fails the run, because a failed run makes GitHub email the
  # account owner. A site that is down still alerts through job alert-down.
  alert-silent:
    name: NOTICE monitor was silent
    needs: check
    if: needs.check.outputs.silent == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    steps:
      - name: Tell the alert router
        env:
          OPS_FEED_URL: ${{ secrets.OPS_FEED_URL }}
          OPS_FEED_INGEST_SECRET: ${{ secrets.OPS_FEED_INGEST_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          url="${OPS_FEED_URL:-https://my.admireworks.com/api/ops-feed/signal}"
          if [ -z "${OPS_FEED_INGEST_SECRET:-}" ]; then
            echo "::warning::OPS_FEED_INGEST_SECRET is not set; the silent-monitor line was not posted (no email by design)"
            exit 0
          fi
          body=$(jq -n --arg run "$RUN_URL" --arg st "silent_$(date -u +%Y%m%d)" \
            '{source: "estate-uptime", entityId: "monitor", state: $st, severity: "high", title: "The uptime monitor was silent", body: "GitHub ran no scheduled estate check for more than 6 hours before this run.", link: $run}')
          if [ -n "$body" ] && curl -fsS --max-time 20 -X POST "$url" \
               -H "Authorization: Bearer $OPS_FEED_INGEST_SECRET" -H "Content-Type: application/json" \
               -d "$body" > /dev/null; then
            echo "routed"
          else
            echo "::warning::router unreachable; the silent-monitor line was not posted (no email by design)"
          fi
          exit 0

  # Monthly commit so GitHub never disables the schedule after 60 days without
  # repository activity. The only job with write access.
  heartbeat:
    if: github.event_name == 'schedule' && github.event.schedule == '17 3 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Commit heartbeat
        run: |
          date -u +%Y-%m-%d > heartbeat.txt
          if git ls-files --error-unmatch heartbeat.txt > /dev/null 2>&1 && git diff --quiet -- heartbeat.txt; then
            echo "heartbeat already recorded today"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "heartbeat $(cat heartbeat.txt)"
          git push
